<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAWME Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <div class="left-side">
            <div class="logo-section">
                <img src="logo.png" alt="LAWME Logo" class="logo">
                <h1>LAWMITRA</h1>
            </div>
        </div>

        <div class="right-side">
            <div class="login-box">
                <form id="login-form">
                    <div class="input-group">
                        <label for="lawid">LAWID</label>
                        <input type="text" id="lawid" placeholder="KA / XX / XXXX" required>
                    </div>
                    <div class="input-group">
                        <label for="pin">PIN</label>
                        <input type="password" id="pin" placeholder="••••••" required>
                    </div>
                    <button type="submit" class="login-btn">LOGIN</button>
                </form>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
