<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAWME - My Cases</title>
    <link rel="stylesheet" href="mycases.css">
</head>
<body>
    <header class="header">
        <div class="logo-section">
            <img src="logo.png" alt="LAWME Logo" class="logo">
            <div class="title-text">
                <h1>LAWME</h1>
                <p>Law portal of India</p>
            </div>
        </div>
        <nav class="nav">
            <ul>
                <li><img src="profile.png" alt="Profile" class="nav-icon"><span><a href="profile.html">PROFILE</a></span></li>
                <li><img src="legis.png" alt="Legislation" class="nav-icon"><span><a href="legislation.html">LEGISLATION</a></span></li>
                <li><img src="service.png" alt="Services" class="nav-icon"><span><a href="services.html">SERVICES</a></span></li>
                <li><img src="bell.png" alt="Reminder" class="nav-icon"><span><a href="reminder.html">REMINDER</a></span></li>
                <li><img src="set.png" alt="Settings" class="nav-icon"><span><a href="settings.html">SETTINGS</a></span></li>
            </ul>
        </nav>
    </header>

    <div class="search-section">
        <h2>MY CASES</h2>
        <div class="search-group">
            <input type="text" placeholder="Search..." class="search-bar">
            <button class="search-button">Advanced Search</button>
            <button class="add-button" onclick="openPopup()">ADD</button>
            <button class="home-button"><a href="home.html">HOME</a></button>
        </div>
    </div>

    <section class="cases-section">
        <div class="cases-column pending">
            <h3>PENDING</h3>
            <p id="pending-empty-message" class="empty-message">Add a case to show in pending</p>
            <div id="pending-cases-list">
                <!-- Pending cases will be added here dynamically -->
            </div>
        </div>
    
        <div class="cases-column solved">
            <h3>SOLVED</h3>
            <p id="solved-empty-message" class="empty-message">Solved cases are shown here</p>
            <div id="solved-cases-list">
                <!-- Solved cases will be added here dynamically -->
            </div>
        </div>
    </section>

    <!-- Popup Form for Adding New Case -->
    <div class="popup-form" id="popupForm">
        <div class="popup-content">
            <span class="close-btn" onclick="closePopup()">&times;</span>
            <h3>Add New Case</h3>
            <form id="add-case-form">
                <input type="text" id="case-number" placeholder="Case Number" required>
                <textarea id="case-description" placeholder="Case Description" required></textarea>
                <label>Upload Document:</label>
                <input type="file" id="document-upload" accept=".pdf,.doc,.docx">
                <label>Upload Image:</label>
                <input type="file" id="image-upload" accept="image/*">
                <button type="button" onclick="submitCase()">Submit</button>
            </form>
        </div>
    </div>

    <!-- Popup Form for Viewing Case Details -->
    <div class="popup-form" id="caseDetailPopup">
        <div class="popup-content">
            <span class="close-btn" onclick="closeCaseDetailPopup()">&times;</span>
            <h3>Case Details</h3>
            <div id="case-detail-content"></div>
            <div id="case-attachments"></div>
            <button type="button" onclick="markAsSolved()">Mark as Solved</button>
            <button type="button" id="delete-case-btn" onclick="deleteCase()">Delete</button>
        </div>
    </div>

    <script src="mycases.js"></script>
</body>
</html>
